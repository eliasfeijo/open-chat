services:
  postgres:
    image: postgres:17-alpine
    container_name: open-chat-postgres
    environment:
      POSTGRES_DB: open_chat
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - open-chat-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: open-chat-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

volumes:
  open-chat-postgres-data:
