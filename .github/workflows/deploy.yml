name: Deploy

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_REALTIME_WS_URL: "wss://chat.eliasfeijo.dev/ws"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Create release metadata
        run: |
          release_id="${GITHUB_SHA::12}"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=open-chat-$release_id.tgz" >> "$GITHUB_ENV"

      - name: Prepare deployment payload
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp package.json deploy/package.json
          cp next.config.ts deploy/next.config.ts
          mkdir -p deploy/.next
          cp -RL node_modules deploy/node_modules
          tar -C .next --exclude=cache -cf - . | tar -C deploy/.next -xf -
          if [ -d public ]; then
            cp -R public deploy/public
          fi

      - name: Archive deployment payload
        run: |
          tar --dereference -czf "$ARCHIVE_NAME" \
            -C deploy \
            .

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -i ~/.ssh/id_ed25519 "$ARCHIVE_NAME" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$ARCHIVE_NAME"

      - name: Activate release on VM
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_ID='$RELEASE_ID' ARCHIVE_NAME='$ARCHIVE_NAME' bash -se" <<'EOF'
          set -euo pipefail
          release_dir="/srv/open-chat/releases/$RELEASE_ID"
          mkdir -p "$release_dir"
          tar -xzf "/tmp/$ARCHIVE_NAME" -C "$release_dir"
          ln -sfn "$release_dir" /srv/open-chat/current
          rm -f "/tmp/$ARCHIVE_NAME"
          sudo -n systemctl restart open-chat
          sudo -n systemctl is-active --quiet open-chat
          EOF

      - name: Verify public URL
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://chat.eliasfeijo.dev"
