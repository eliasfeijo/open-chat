<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RoomSurf Icon</title>
  <desc id="desc">Rounded-square app icon with a chat bubble and a bold surfboard mark representing public conversations on RoomSurf.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="52" y1="44" x2="460" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#10233e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(396 124) rotate(126) scale(210)">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#facc15" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bubbleFill" x1="140" y1="138" x2="366" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaf2"/>
    </linearGradient>

    <linearGradient id="boardFill" x1="232" y1="96" x2="284" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2aa3bb"/>
      <stop offset="1" stop-color="#0d5f78"/>
    </linearGradient>

    <filter id="bubbleShadow" x="96" y="98" width="328" height="334" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="10" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="boardClip">
      <path d="M256 74C278 92 292 146 292 226C292 303 278 347 256 370C234 347 220 303 220 226C220 146 234 92 256 74Z"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#sunGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#e2e8f0" stroke-opacity="0.14" stroke-width="4"/>

  <circle cx="396" cy="126" r="20" fill="#facc15"/>
  <circle cx="396" cy="126" r="8" fill="#fff7c2"/>
  <circle cx="146" cy="110" r="8" fill="#f8fafc" fill-opacity="0.22"/>
  <circle cx="124" cy="130" r="4" fill="#f8fafc" fill-opacity="0.2"/>

  <g filter="url(#bubbleShadow)">
    <path d="M128 188C128 159.28 151.28 136 180 136H332C360.72 136 384 159.28 384 188V272C384 300.72 360.72 324 332 324H248L184 376V324H180C151.28 324 128 300.72 128 272V188Z" fill="url(#bubbleFill)"/>
    <path d="M128 188C128 159.28 151.28 136 180 136H332C360.72 136 384 159.28 384 188V272C384 300.72 360.72 324 332 324H248L184 376V324H180C151.28 324 128 300.72 128 272V188Z" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="3"/>
  </g>

  <path d="M166 295C184 285 201 281 220 281C239 281 257 286 275 291C292 296 310 300 329 300C339 300 348 299 356 296" fill="none" stroke="#d6eef6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.82" stroke-width="9"/>

  <g transform="rotate(-2 256 228)">
    <path d="M212 148C228 144 247 145 266 150" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.18" stroke-width="4"/>

    <path d="M256 74C278 92 292 146 292 226C292 303 278 347 256 370C234 347 220 303 220 226C220 146 234 92 256 74Z" fill="url(#boardFill)"/>
    <path d="M256 74C278 92 292 146 292 226C292 303 278 347 256 370C234 347 220 303 220 226C220 146 234 92 256 74Z" fill="none" stroke="#0a5164" stroke-linejoin="round" stroke-width="9"/>

    <g clip-path="url(#boardClip)">
      <path d="M224 246C236 241 246 239 256 239C267 239 278 241 289 246" fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
    </g>

    <path d="M256 112V340" fill="none" stroke="#d7f2f8" stroke-linecap="round" stroke-opacity="0.9" stroke-width="5"/>
  </g>
</svg>